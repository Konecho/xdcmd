name: tests

on:
  workflow_dispatch:
  # Temporarily disabled automatic tests. Uncomment to re-enable.
  # push:
  # pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest
      - run: uv run ruff check xdnmb/scroll.py tests
      - run: uv run black --check xdnmb/scroll.py tests
